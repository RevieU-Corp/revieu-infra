apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app-platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/RevieU-Corp/revieu-infra.git
      targetRevision: main
      path: argocd/platform/shared
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
