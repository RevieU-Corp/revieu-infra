# Root App 详细解析 - 生产环境示例

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app-prod          # ← 这个 App 的名字
  namespace: argocd             # ← 必须在 argocd namespace 里
  finalizers:
    - resources-finalizer.argocd.argoproj.io  # ← 删除时会连带清理所有子资源
spec:
  project: default              # ← 使用 default 项目（Root App 通常不受限制）

  # 重点！sources 是复数形式，可以指定多个源
  sources:
    # 源 1: Platform Apps（基础设施层）
    - repoURL: https://github.com/RevieU-Corp/revieu-infra.git
      targetRevision: main
      path: argocd/platform/prod
      # ↑ 这个路径下有 4 个文件：
      #   - platform-apps.yaml (聚合器)
      #   - infra-foundation.yaml (Wave 0: cert-manager, sealed-secrets)
      #   - infra-core.yaml (Wave 1: namespace, ClusterIssuer, Certificate)
      #   - infra-observability.yaml (Wave 2: loki, grafana, traefik)

    # 源 2: Application Apps（业务应用层）
    - repoURL: https://github.com/RevieU-Corp/revieu-infra.git
      targetRevision: main
      path: argocd/applications/prod
      # ↑ 这个路径下有 4 个文件：
      #   - application-apps.yaml (聚合器)
      #   - argocd.yaml (Wave 10: ArgoCD 自管理)
      #   - web.yaml (Wave 11: 前端应用)
      #   - core.yaml (Wave 11: 后端 API)

  destination:
    server: https://kubernetes.default.svc  # ← 本地 K8s 集群
    namespace: argocd                       # ← 子 Application 对象会创建在 argocd namespace

  syncPolicy:
    automated:
      prune: false     # ⚠️ 关键！不自动删除子应用（防止误操作删掉所有东西）
      selfHeal: true   # ✅ 自动修复配置漂移
    syncOptions:
      - CreateNamespace=true  # ← 自动创建 namespace（如果不存在）

# ═══════════════════════════════════════════════════════════════
# 工作流程：
# ═══════════════════════════════════════════════════════════════
#
# 1. 你部署这个 root-app-prod.yaml
#    kubectl apply -f argocd/root/root-app-prod.yaml
#
# 2. ArgoCD 发现这个 Application，读取 sources 里的两个路径
#
# 3. ArgoCD 在 argocd/platform/prod/ 找到 4 个 Application 定义
#    → 创建 4 个 Platform 相关的 Application 对象
#
# 4. ArgoCD 在 argocd/applications/prod/ 找到 4 个 Application 定义
#    → 创建 4 个 Application 相关的 Application 对象
#
# 5. 这 8 个子 Application 再根据各自的配置，部署实际的 K8s 资源
#
# 最终结果：
# - 你只部署了 1 个 YAML 文件
# - ArgoCD 自动创建了 8 个子 Application
# - 这 8 个子 Application 部署了几十个实际的 K8s 资源
#
# ═══════════════════════════════════════════════════════════════
