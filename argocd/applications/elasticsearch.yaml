apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: elasticsearch
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/RevieU-Corp/revieu-infra
    targetRevision: main
    path: apps/overlays/prod/apps/elasticsearch
  destination:
    server: https://kubernetes.default.svc
    namespace: revieu-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
