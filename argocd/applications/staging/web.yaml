apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: revieu-web-staging
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "11"
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/component: frontend
    environment: staging
spec:
  project: applications
  source:
    repoURL: https://github.com/RevieU-Corp/revieu-infra.git
    targetRevision: main
    path: apps/overlays/staging/applications/web
  destination:
    server: https://kubernetes.default.svc
    namespace: revieu-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        maxDuration: 2m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - .spec.template.metadata.annotations."kubectl.kubernetes.io/restartedAt"
