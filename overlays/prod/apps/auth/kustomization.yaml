apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../base/apps/auth

images:
  - name: ghcr.io/revieu-corp/revieu-auth-service
    newTag: sha-sha-fa73ed5 # 对应 auth 的版本号

configMapGenerator:
  - name: revieu-auth-config
    behavior: replace
    literals:
      - POSTGRES_HOST="postgres-host"
      - POSTGRES_PORT="5432"
      - POSTGRES_DB="revieu"
      - LOG_DIR="/tmp/revieu_logs"
      - FLASK_ENV="development"
      - MAIL_SERVER="smtp.gmail.com"
      - MAIL_PORT="465"
      - MAIL_USE_TLS="False"
      - MAIL_USE_SSL="True"
      - MAIL_SENDER_NAME="RevieU"
      - MAIL_SENDER_EMAIL="contact@weijun.online"
  - name: revieu-auth-env-config
    behavior: replace
    literals:
      - GOOGLE_REDIRECT_URI="https://revieu.weijun.online/api/v1/auth/google/callback"
      - GITHUB_REDIRECT_URI="https://revieu.weijun.online/api/v1/auth/github/callback"
      - FRONTEND_URL="http://localhost:5173"
      - DOMAIN="http://localhost:8082"

secretGenerator:
  - name: revieu-auth-secret
    behavior: replace
    envs:
      - secrets.env
