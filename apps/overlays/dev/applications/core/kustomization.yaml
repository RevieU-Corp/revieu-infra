apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../base/applications/core
  # Dev 环境不需要外部 sealed-secrets

namespace: revieu-dev

images:
  - name: ghcr.io/revieu-corp/revieu-core
    newTag: dev-latest

patches:
  - target:
      kind: Deployment
      name: revieu-core
    patch: |-
      - op: add
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: "256Mi"
          limits:
            memory: "512Mi"

  - target:
      kind: Ingress
      name: revieu-core-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: dev.revieu.weijun.online
