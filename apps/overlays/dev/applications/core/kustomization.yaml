apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../base/applications/core

namespace: revieu-dev

images:
  - name: ghcr.io/revieu-corp/revieu-core
    newTag: sha-36ccc09

patches:
  - target:
      kind: Deployment
      name: revieu-core
    patch: |-
      - op: add
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: "256Mi"
          limits:
            memory: "512Mi"

  - target:
      kind: Ingress
      name: revieu-core-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: dev.revieu.weijun.online
      - op: replace
        path: /spec/tls/0/hosts/0
        value: dev.revieu.weijun.online
