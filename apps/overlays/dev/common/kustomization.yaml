apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/common
  - ghcr-credentials-sealed.yaml

namespace: revieu-dev

# Dev 环境补丁：使用测试域名 + 受信任的生产证书（Let's Encrypt production）
patches:
  - target:
      kind: ClusterIssuer
      name: letsencrypt-prod
    patch: |-
      - op: replace
        path: /metadata/name
        value: letsencrypt-prod-dev
      - op: replace
        path: /spec/acme/server
        value: https://acme-v02.api.letsencrypt.org/directory
      - op: replace
        path: /spec/acme/privateKeySecretRef/name
        value: letsencrypt-prod-dev-account-key

  - target:
      kind: Certificate
      name: revieu-cert
    patch: |-
      - op: replace
        path: /spec/dnsNames
        value:
          - dev.revieu.weijun.online
      - op: replace
        path: /spec/issuerRef/name
        value: letsencrypt-prod-dev
