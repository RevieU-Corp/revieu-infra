apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../../../base/apps/argocd

patches:
# 1. 补丁：开启 insecure 模式 (之前讲过的)
- target:
    kind: Deployment
    name: argocd-server
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --insecure

# 2. 补丁：注入 Ingress 的域名和 TLS 配置
- target:
    kind: Ingress
    name: argocd-server-ingress
  patch: |-
    - op: add
      path: /metadata/annotations/cert-manager.io~1cluster-issuer # 注意：json patch 里 / 要转义为 ~1
      value: letsencrypt-prod
    - op: replace
      path: /spec/rules/0/host
      value: argocd.weijun.online
    - op: add
      path: /spec/tls
      value: 
        - hosts: 
          - argocd.weijun.online
          secretName: argocd-server-tls