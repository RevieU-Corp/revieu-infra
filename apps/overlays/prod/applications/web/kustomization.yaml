apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../base/applications/web

images:
  - name: ghcr.io/revieu-corp/revieu-web
    newTag: sha-126bd82 # 具体的版本号

patches:
  - target:
      kind: Deployment
      name: revieu-web
    patch: |-
      - op: add
        path: /spec/replicas
        value: 1
