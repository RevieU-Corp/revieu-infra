apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../base/infrastructure/traefik

namespace: revieu-staging

patches:
  - target:
      kind: Middleware
      name: revieu-auth-middleware
    patch: |-
      - op: replace
        path: /spec/forwardAuth/address
        value: http://revieu-auth-service.revieu-staging.svc.cluster.local:8080/verify
