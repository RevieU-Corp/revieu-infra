apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../base/applications/web

namespace: revieu-staging

images:
  - name: ghcr.io/revieu-corp/revieu-web
    newTag: staging-latest  # Staging 环境使用 staging tag

patches:
  - target:
      kind: Deployment
      name: revieu-web
    patch: |-
      - op: add
        path: /spec/replicas
        value: 2
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: "256Mi"
          limits:
            memory: "512Mi"

  - target:
      kind: Ingress
      name: revieu-web-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: staging.revieu.weijun.online
      - op: replace
        path: /spec/tls/0/hosts/0
        value: staging.revieu.weijun.online
