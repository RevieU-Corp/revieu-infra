apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../base/applications/core

namespace: revieu-staging

images:
  - name: ghcr.io/revieu-corp/revieu-core
    newTag: staging-latest

patches:
  - target:
      kind: Deployment
      name: revieu-core
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "1Gi"

  - target:
      kind: Ingress
      name: revieu-core-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: staging.revieu.weijun.online
