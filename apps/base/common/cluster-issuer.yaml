apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # 默认占位符，建议在 overlays 中通过 patch 覆盖
    email: admin@example.com
    # Let's Encrypt 生产环境服务器
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      # 存储账号私钥的 Secret 名称
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          cloudflare:
            # 这里的 email 是你的 Cloudflare 账号邮箱
            email: liweijun0302@gmail.com
            # 引用存储 API Token 的 Secret
            apiTokenSecretRef:
              name: cloudflare-api-token-secret
              key: api-token